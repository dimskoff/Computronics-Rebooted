name: Build & Release Computronics-Rebooted

on:
  push:
    branches: [ "1.21.1", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "1.21.1", "master" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release?'
        required: false
        type: boolean
        default: true

jobs:
  build:
    name: Build NeoForge Mod JAR
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Mod with Gradle
        run: ./gradlew build -x test --stacktrace

      - name: Archive Built Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: computronics-neoforge-1.21.1
          path: build/libs/*.jar

      - name: Automatic GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.0.0-dev.1' }}
          name: "Computronics: Rebooted v2.0.0-dev.1 (Minecraft 1.21.1 NeoForge)"
          files: build/libs/*.jar
          generate_release_notes: true
          draft: false
          prerelease: false
