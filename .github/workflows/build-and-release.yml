name: Build & Release Computronics-Rebooted

on:
  push:
    branches: [ "1.21.1", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "1.21.1", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build NeoForge Mod JAR
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check OpenComputers dependency
        run: test -f libs/opencomputers-1.9.4-5.jar || (echo "libs/opencomputers-1.9.4-5.jar is missing" && exit 1)

      - name: Build (with tests)
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: computronics-neoforge-1.21.1
          path: build/libs/*.jar

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Computronics: Rebooted ${{ github.ref_name }} (Minecraft 1.21.1 NeoForge)"
          files: build/libs/*.jar
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
